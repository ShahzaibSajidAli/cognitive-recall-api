name: Deploy to EC2
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'extension/**'
      - '.github/workflows/**'
      - '*.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cognitive-recall-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_TAG="${IMAGE_TAG::7}"
          echo "Using image tag: $SHORT_TAG"

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_TAG

      - name: Access SSM Session & Deploy Container
        run: |
            TAG_FULL="${{ github.sha }}"
            TAG_SHORT=${TAG_FULL::7}
            aws ssm send-command \
            --instance-ids i-09639b87639a51f05 \
            --region ap-southeast-2 \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["runuser -l ec2-user -c 'bash /home/ec2-user/deploy.sh $TAG_SHORT'"]
